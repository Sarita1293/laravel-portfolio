name: Laravel Docker CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t laravel-portfolio .

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate Composer
        run: docker run --rm laravel-portfolio composer validate --no-check-publish

      - name: Laravel Version Check
        run: docker run --rm laravel-portfolio php artisan --version
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        run: |
          docker tag laravel-portfolio:latest 456421176141.dkr.ecr.ap-south-1.amazonaws.com/laravel-portfolio:latest
          docker push 456421176141.dkr.ecr.ap-south-1.amazonaws.com/laravel-portfolio:latest