name: Laravel Docker CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t laravel-portfolio .

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate Composer
        run: docker run --rm laravel-portfolio composer validate --no-check-publish

      - name: Laravel Version Check
        run: docker run --rm laravel-portfolio php artisan --version